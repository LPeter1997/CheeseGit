name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release (example: 1.2.3)"
        required: true
      release_notes:
        description: "Release notes for the version in base64-encoded Markdown"
        required: true

jobs:
  release:
    permissions:
      contents: write

    strategy:
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}

    environment: Deployment

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Update version temporarily
        run: |
          cd src-tauri
          cargo set-version ${{ github.event.inputs.version }}
          cd ..

      - name: Install frontend dependencies
        run: pnpm install

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Decode release notes
        id: decode
        shell: bash
        run: |
          decoded=$(echo "${{ github.event.inputs.release_notes }}" | base64 --decode)

          # trim leading/trailing whitespace (including newlines)
          decoded=$(echo "$decoded" | awk '{gsub(/^[ \t\r\n]+|[ \t\r\n]+$/,""); print}')

          {
            echo "release_body<<EOF"
            echo "$decoded"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: v${{ github.event.inputs.version }}
          releaseBody: ${{ steps.decode.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          includeUpdaterJson: true
          retryAttempts: 3